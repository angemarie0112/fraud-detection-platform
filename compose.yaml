services:
  fraud-api:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: fraud-detection-api

    ports:
      - "127.0.0.1:8001:8000"

    volumes:
      - ./models:/app/models:ro

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s